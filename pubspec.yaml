name: notes_app

description: A Flutter Notes App using Floor SQLite, optional location, and shake-to-delete.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  floor: ^1.5.0
  sqflite: ^2.3.0
  geolocator: ^14.0.3
  geocoding: ^4.0.0
  shake: ^3.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  floor_generator: ^1.5.0

flutter:
  uses-material-design: true
